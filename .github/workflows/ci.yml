# CI: runs on every push and pull request, and by hand from the Actions tab
# (workflow_dispatch). Two independent jobs:
#   test    (M0) Python tests, no MATLAB. The generated-code back-to-back runs
#                locally (academic license, D10 rev.); this job checks its
#                committed record, results/back_to_back.json (D28), and the
#                local-only tests skip themselves.
#   matlab  (M6) the MATLAB/Simulink model tests (tests/matlab).
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    # A fresh Linux machine on every run: proves nothing depends on the author's PC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same Python version as the local .venv.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # The pinned packages listed in requirements.txt (numpy, pandas, pytest).
      - run: pip install -r requirements.txt
      - run: pytest -q tests/python

  matlab:
    # MathWorks licenses MATLAB and Simulink products for public repositories in
    # GitHub Actions at no cost, except code-generation products ("transformation
    # products"). These tests need no Coder: Simulink runs the models, Simulink
    # Control Design provides linearize (TestPlant). The release must match the
    # models (saved in R2026a).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Simulink Simulink_Control_Design
          # Keep the MATLAB installation between runs: much faster after the first.
          cache: true
      # Same selection as run_tests('dev'): every MATLAB test except the accepted
      # KnownFail (REQ-P-02). Tests that cannot apply on a clean machine (private
      # vehicle data, D21) end as 'incomplete' and are allowed; a failure is not.
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            openProject(pwd);
            suite = testsuite('tests/matlab').selectIf(~matlab.unittest.selectors.HasTag('KnownFail'));
            results = run(testrunner('textoutput'), suite);
            disp(table(results));
            counts = sprintf('passed %d, failed %d, incomplete %d (of %d)', nnz([results.Passed]), nnz([results.Failed]), nnz([results.Incomplete]), numel(results));
            disp(counts);
            % Also on the run's summary page, readable without opening the log
            fid = fopen(getenv('GITHUB_STEP_SUMMARY'), 'a'); fprintf(fid, '### MATLAB tests\n\n%s\n', counts); fclose(fid);
            assert(~any([results.Failed]), 'MATLAB tests failed');
